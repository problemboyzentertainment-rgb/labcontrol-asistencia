# Render Blueprint: Web Service + PostgreSQL, ambos en plan GRATUITO.
# Uso: Render Dashboard > New > Blueprint > seleccionar el repositorio de GitHub.
databases:
  - name: labcontrol-db
    plan: free
    databaseName: labcontrol
    user: labcontrol

services:
  - type: web
    name: labcontrol-asistencia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true            # CI/CD: cada push a la rama principal redespliega
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: APP_TZ
        value: America/Guayaquil
      - key: DATABASE_URL
        fromDatabase:
          name: labcontrol-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false             # Render te lo pedirá al crear el Blueprint
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: MAX_USOS_SIMULTANEOS
        value: "3"
